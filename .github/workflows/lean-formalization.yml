name: Lean formalization

on:
  push:
    branches: [main]
    paths:
      - "Lean/**"
      - ".github/workflows/lean-formalization.yml"
  pull_request:
    branches: [main]
    paths:
      - "Lean/**"
      - ".github/workflows/lean-formalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Lean and resolve Mathlib dependencies
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd Lean
          lake update
      - name: Build Lean project and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: RiemannHypothesisLean
