name: Lean formalization

on:
  push:
    branches: [main]
    paths:
      - "Lean/**"
      - ".github/workflows/lean-formalization.yml"
  pull_request:
    branches: [main]
    paths:
      - "Lean/**"
      - ".github/workflows/lean-formalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Lean project and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: RiemannHypothesisLean
